<!-- Supabase > Authentication > Email Templates > Confirm signup
     Assunto sugerido: Confirme seu e-mail no Olheiro de Preço -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#131b33">
  <p style="font-size:20px;font-weight:bold;margin:0 0 24px">Olheiro de Preço</p>
  <h1 style="font-size:24px;margin:0 0 12px">Falta só confirmar seu e-mail</h1>
  <p style="font-size:16px;line-height:1.5;color:#5b6480;margin:0 0 24px">
    Toque no botão abaixo pra ativar sua conta. Você cai direto na configuração, que leva uns cinco minutos.
  </p>
  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2448f0;color:#ffffff;text-decoration:none;font-weight:bold;font-size:16px;padding:14px 24px;border-radius:12px">Confirmar e-mail</a>
  <p style="font-size:14px;line-height:1.5;color:#5b6480;margin:32px 0 0">
    Se você não criou uma conta no Olheiro de Preço, é só ignorar este e-mail.
  </p>
</div>
